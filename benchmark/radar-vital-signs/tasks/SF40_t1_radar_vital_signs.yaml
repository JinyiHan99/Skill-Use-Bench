skill_constraints_tested:
- id: c1
  description: BR lower band edge 0.08 Hz (4.8 bpm) instead of textbook 0.1 Hz (6 bpm)
  exclusive: Using the standard 0.1-0.5 Hz breathing band from general textbooks/papers
- id: c2
  description: HR band uses [0.7, 3.0] Hz instead of textbook [0.8, 2.5] Hz
  exclusive: This dataset has no boundary samples to support this distinction; kept as a method-spec constraint, not a core verification point
- id: c3
  description: Must use phase np.angle() instead of magnitude np.abs()
  exclusive: For complex signals, default to taking magnitude for FFT/PSD; magnitude is more intuitive
- id: c4
  description: Static clutter removal must be executed before np.angle()
  exclusive: May take the angle first then subtract the mean, or not do clutter removal
- id: c5
  description: Decimate to ~50 Hz before sub-Hz bandpass filtering
  exclusive: Designing a sub-Hz filter directly at kHz sampling rate
- id: c6
  description: HR and BR use two independent bandpass filters processed separately
  exclusive: Dual independent bandpass is a domain-standard practice and does not constitute strong exclusivity; kept as a pipeline-spec constraint
