task_id: SF22_t1_setup_fuzzing
level: L2
skill_id: skill_22_fuzzing
description: |
  You are given a Python library repository at `./assets/SF22_t1_setup_fuzzing/repo/`. Your task is to:
  1. Analyze the codebase to identify the most important functions for fuzz testing
  2. Write a file `APIs.txt` in the repository root listing the selected fuzz targets
  3. For each target, create an Atheris-based fuzz harness in `./assets/SF22_t1_setup_fuzzing/repo/fuzz/`

  Select an appropriate set of fuzz targets that best stress the library's input-handling surface.
initial_state:
  assets:
