skill_constraints_tested:
- id: c1
  description: The output directory must be results/{label}/, containing a plots/ subdirectory, with filenames fixed as planned_trajectory.npy / metrics_3d.json / tuning_results.json
  exclusive: After cleanup the description no longer specifies output paths and filenames. A model that does not read the skill will choose its own directories (e.g. ./output/, ./results/) and filenames (e.g. trajectory.npy, metrics.json, gains.json), which cannot match the evaluation script's expectations.
- id: c2
  description: The trajectory matrix must be of shape (15 x max_iter), with rows 0:3=pos, 3:6=vel, 6:9=orientation, 9:12=ang_vel, 12:15=acc
  exclusive: After cleanup the description no longer gives the matrix dimensions and row layout. A model that does not read the skill typically uses a 6-13 row state representation (position/velocity only, or quaternion attitude), and will not spontaneously produce a 15-row layout with an acceleration row.
- id: c3
  description: The acceleration components of the planned trajectory (matrix rows 12:15) must not exceed the physical limits in system_params.yaml at any timestep
  exclusive: After cleanup the description no longer indicates which rows are acceleration, nor gives field names. A model that does not read the skill may not include acceleration rows in the trajectory matrix, or may only apply the constraint as a post-simulation posterior check rather than during planning.
- id: c4
  description: The integral state of the position controller must be created via explicit initialization outside the control loop and accumulate continuously during simulation; mutable Python default arguments must not be used, and the integral state must not be re-initialized at each timestep
  exclusive: "A model that does not read the skill typically writes integral = np.zeros(3) directly outside the loop and accumulates correctly, without using a dict-wrapping or factory-function pattern. A more common error is using a mutable default argument in the function signature def foo(integral={\"e\": zeros(3)})"
notes: 'Source: skillsbench/drone-planning-control

  Domain: control systems

  Phase1 score: 0.41

  Confidence: 0.85

  Tuning-granularity note: each command directory must contain its own tuning_results.json, but all commands may share the same set of gains, or each may tune independently.'
