task_id: SF49_t1_drone_planning_control
level: L2
skill_id: skill_49_position_controller_trajectory_planner
description: >
  Given the physical parameters of a quadrotor drone
  (assets/SF49_t1_drone_planning_control/system_params.yaml) and a set of
  natural-language flight commands
  (assets/SF49_t1_drone_planning_control/commands/), build a simulation
  that plans trajectories and controls the drone to execute each command
  in 3D.

  For each command file, produce simulation outputs—including planned and
  actual trajectories, control performance metrics, tuned controller
  parameters, and comparison plots—under a dedicated results directory.

  The planned trajectory must respect the physical acceleration limits
  defined in system_params.yaml. Successfully executed commands must
  exhibit steady-state error < 0.05 m, overshoot < 5%, and per-timestep
  position tracking error < 0.05 m.
