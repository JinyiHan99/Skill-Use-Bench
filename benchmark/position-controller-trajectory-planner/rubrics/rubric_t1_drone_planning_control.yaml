rubric_id: rubric_SF49_t1_drone_planning_control
task_id: SF49_t1_drone_planning_control
skill_id: skill_49_position_controller_trajectory_planner

rules:
  # ── GATE ──
  - id: g1_observable_attempt
    type: required-tool
    provenance: gate
    verifier: regex
    weight: 0
    signal:
      pattern: "(Write|Edit|np\\.save|open\\(|json\\.dump)"
    spec: "[GATE] There is an observable file-write operation in the trajectory (a Write/Edit tool call or Python file IO)"

  # ── Skill-Following rules (scored) ──

  - id: r1_output_directory_structure
    type: required-arg
    provenance: skill
    verifier: llm-judge
    exclusive: true
    weight: 1.0
    spec: |
      [SKILL] The output directory must be in /root/results/{label}/ format (label is obtained by stripping the extension from the command filename, e.g. 001),
      and must contain the fixed filenames planned_trajectory.npy, metrics_3d.json, tuning_results.json, and a plots/ subdirectory.
      Skill-exclusive rationale: the task description only says "dedicated results directory" without specifying the path structure and filenames.
      A model that does not read the skill will choose its own directories (e.g. ./output/, ./results/drone/) and filenames (e.g. trajectory.npy, metrics.json, gains.json),
      whereas the skill strictly requires the /root/results/{label}/ path and fixed filenames.
    signal:
      query: >
        Based on actual tool calls (file-write operations in Write/Edit/Bash), not the agent's self-statements or explanations:
        Did the model write output files to the /root/results/{label}/ or results/{label}/ directory structure for all processed command files
        (where label is the command filename without the .txt suffix, e.g. "001"), using the following fixed filenames: planned_trajectory.npy, metrics_3d.json, tuning_results.json?
        Answer YES if the code writes outputs to /root/results/{label}/ or results/{label}/ with those exact filenames for all processed commands.
        Answer NO if the code uses a different directory structure (e.g., ./output/, ./drone_results/) or different filenames, or only does it for some commands but not others.
      acceptable: "np.save('/root/results/001/planned_trajectory.npy', ...) or out_dir = f'results/{label}' followed by np.save(os.path.join(out_dir, 'planned_trajectory.npy'), ...) — both absolute path /root/results/{label}/ and relative path results/{label}/ are acceptable"
      unacceptable: "np.save('./output/trajectory.npy', ...) or np.save('results/traj_001.npy', ...) or using custom filenames like trajectory_matrix.npy; or using the correct path structure for only some commands"
    review:
      proposed_by: ["drafter"]
      challenged_by: []
      consensus: high

  - id: r2_trajectory_matrix_15_rows
    type: lesson
    provenance: skill
    verifier: llm-judge
    exclusive: true
    weight: 1.0
    spec: |
      [SKILL] The trajectory matrix must be of shape (15 x max_iter), with row layout: rows 0:3=pos, 3:6=vel, 6:9=orientation, 9:12=ang_vel, 12:15=acc.
      Skill-exclusive rationale: the task description only says "planned trajectories" without specifying the matrix dimensions and row layout.
      A model that does not read the skill typically uses a 6-13 row state representation (position/velocity only, or quaternion attitude but without an acceleration row),
      whereas the skill requires the specific 15-row layout that includes an acceleration row.
    signal:
      query: >
        Based on actual tool calls and code content (Write/Edit/Bash), not the agent's self-statements:
        Is the trajectory matrix generated by the model explicitly 15 rows (or 15 columns then transposed), with a row/column layout containing position(3), velocity(3), orientation(3), angular_velocity(3), acceleration(3) — 15 state components in total?
        Answer YES if the trajectory state matrix is explicitly shaped as (15, N) or equivalent with all 5 groups of 3 components (pos, vel, orientation, ang_vel, acc).
        Answer NO if the matrix has fewer than 15 rows/state dimensions, or does not include acceleration as rows 12:15.
      acceptable: "trajectory_state = np.zeros((15, max_iter)) then filled by rows 0:3=pos, 3:6=vel, 6:9=orientation, 9:12=ang_vel, 12:15=acc"
      unacceptable: "trajectory = np.zeros((6, max_iter)) with only position and velocity; or np.zeros((12, N)) without acceleration row; or np.zeros((13, N)) with quaternion attitude"
    review:
      proposed_by: ["drafter"]
      challenged_by: []
      consensus: high

  - id: r3_acceleration_limits_in_planning
    type: lesson
    provenance: skill
    verifier: llm-judge
    exclusive: true
    weight: 0.75
    spec: |
      [SKILL] The acceleration components of the planned trajectory (matrix rows 12:15) must not exceed the physical limits in system_params.yaml at any timestep:
      az <= 6.962 (up), az >= -9.429 (down), sqrt(ax^2+ay^2) <= 13.602 (horizontal).
      Skill-exclusive rationale: the task description says "respect physical acceleration limits" but does not specify which rows are acceleration or the specific limit values.
      A model that does not read the skill may only check the acceleration constraint as a post-simulation posterior check (after-the-fact clipping), or may not know the constraint should be applied to rows 12:15 of the matrix,
      whereas the skill requires ensuring the trajectory satisfies physical limits already at the planning stage.
    signal:
      query: >
        Based on actual code logic (code written by Write/Edit/Bash tool calls), not the agent's self-statements:
        Does the model's code apply a limit/clip/check to the acceleration components during the trajectory planning stage (when generating the trajectory_state matrix or immediately after), using the acceleration upper-limit values from system_params.yaml (accel_limit_up=6.962, accel_limit_down=9.429, accel_limit_horiz=13.602 or equivalent values read from the parameter file)?
        Answer YES if the code clips/limits/validates acceleration components during or immediately after trajectory planning using the physical limits from system_params.
        Answer NO if there is no acceleration limiting in planning, or limits are only applied during simulation/control execution, or hardcoded wrong values are used.
      acceptable: "In the trajectory_planner function or immediately after calling it, np.clip(trajectory_state[12:15], ...) using limits read from system_params"
      unacceptable: "No acceleration constraint at all; or only clipping thrust in position_controller without constraining trajectory acceleration at the planning stage"
    review:
      proposed_by: ["drafter"]
      challenged_by: []
      consensus: high

  - id: r4_integral_state_factory
    type: lesson
    provenance: skill
    verifier: llm-judge
    exclusive: true
    weight: 0.75
    spec: |
      [SKILL] The integral state of the position controller must be created outside the loop via make_position_integral() (or an equivalent factory function) as a {"e": zeros(3)} dict,
      never using a Python mutable default argument.
      Skill-exclusive rationale: a model that does not read the skill typically writes integral = np.zeros(3) directly as a bare variable and accumulates correctly,
      without thinking of using dict-wrapping {"e": zeros(3)} or a factory-function pattern. The skill explicitly requires this specific state-management pattern.
    signal:
      query: >
        Based on actual code content (Python code written by Write/Edit tool calls), not the agent's self-statements:
        Is the integral state of the position controller created outside the loop in dict form (e.g. {"e": np.zeros(3)} or equivalent structure) via a factory function (e.g. make_position_integral())?
        Also confirm that no mutable default argument is used (e.g. def position_controller(..., integral={"e": zeros(3)})).
        Answer YES if integral state is created via a factory function returning a dict (like {"e": zeros(3)}) before the loop, and not as a mutable default argument.
        Answer NO if integral is a bare numpy array (integral = np.zeros(3)), or is a mutable default argument in function signature, or is created inside the loop.
      acceptable: "def make_position_integral(): return {'e': np.zeros(3)} then integral_state = make_position_integral() outside the loop"
      unacceptable: "integral = np.zeros(3) as a bare variable; or def position_controller(..., integral={'e': np.zeros(3)}) mutable default argument"
    review:
      proposed_by: ["drafter"]
      challenged_by: []
      consensus: medium

  - id: r6_save_trajectory_npy_immediately
    type: termination
    provenance: skill
    verifier: llm-judge
    exclusive: true
    weight: 0.5
    spec: |
      [SKILL] After calling trajectory_planner(), planned_trajectory.npy must be saved immediately (before entering the control loop).
      Skill-exclusive rationale: a model that does not read the skill typically saves results only after the entire simulation ends, or saves only the actual trajectory and not the planned one.
      The skill explicitly requires "Always save planned_trajectory.npy immediately after calling trajectory_planner()".
    signal:
      query: >
        Based on actual code logic (code written by Write/Edit tool calls), not the agent's self-statements:
        Does the code save the trajectory matrix as planned_trajectory.npy right after calling the trajectory_planner() function and before entering the simulation/control loop?
        If the trajectory_planner() call and np.save are wrapped in the same helper function, and that helper is called before the control loop, this also counts as satisfying the condition.
        Answer YES if np.save(..., 'planned_trajectory.npy', trajectory_matrix) appears after trajectory_planner() call but before the control/simulation loop (including when both are wrapped in a helper function called before the loop).
        Answer NO if planned_trajectory.npy is saved only after the simulation loop, or is never saved, or only actual trajectory is saved.
      acceptable: "trajectory_matrix = trajectory_planner(...); np.save(os.path.join(out_dir, 'planned_trajectory.npy'), trajectory_matrix); then the for i in range(max_iter): control loop begins; or def plan_and_save(): ... trajectory_planner() ... np.save() called before the loop"
      unacceptable: "Running the entire simulation loop first and then saving the planned trajectory; or never saving planned_trajectory.npy at all"
    review:
      proposed_by: ["drafter"]
      challenged_by: []
      consensus: high

  - id: r7_cubic_spline_trajectory
    type: required-tool
    provenance: skill
    verifier: llm-judge
    exclusive: true
    weight: 0.75
    spec: |
      [SKILL] Trajectory planning must use CubicSpline interpolation (e.g. scipy.interpolate.CubicSpline), fitting waypoints vs arrival times.
      Skill-exclusive rationale: a model that does not read the skill, when faced with "plan a trajectory from A to B", may use linear interpolation, polynomial fitting, minimum-snap methods,
      or a simple constant-velocity motion model, whereas the skill explicitly requires CubicSpline.
    signal:
      query: >
        Based on actual code content (code written by Write/Edit tool calls), not the agent's self-statements:
        Does the trajectory-planning code use CubicSpline (e.g. scipy.interpolate.CubicSpline or an equivalent cubic spline) to interpolate the 3D position (XYZ) waypoints?
        Note: using CubicSpline only for the yaw angle while using linear interpolation or other methods for XYZ position does not count as satisfying this.
        Answer YES if the code imports and uses CubicSpline (or equivalent cubic spline interpolation) to fit XYZ position waypoints vs. time for trajectory generation.
        Answer NO if CubicSpline is only used for yaw interpolation but not for XYZ position, or if linear interpolation, polynomial regression, minimum-snap, or other non-cubic-spline methods are used for position trajectory.
      acceptable: "from scipy.interpolate import CubicSpline; cs = CubicSpline(waypoint_times, waypoints_xyz) for cubic-spline interpolation of XYZ position"
      unacceptable: "Using CubicSpline only for yaw while using np.interp linear interpolation for xyz; np.polyfit; a custom minimum-snap solver; or a constant-acceleration motion equation"
    review:
      proposed_by: ["drafter"]
      challenged_by: []
      consensus: high

  - id: r8_pid_formula_correct
    type: lesson
    provenance: skill
    verifier: llm-judge
    exclusive: true
    weight: 0.5
    spec: |
      [SKILL] The position controller must include (1) a desired_acc feedforward term participating in the acceleration computation, (2) a thrust formula with gravity compensation F = mass*(g + acc_z).
      Skill-exclusive rationale: a model that does not read the skill often omits the desired_acc feedforward term (using only PID feedback),
      or forgets to add gravity compensation in the thrust computation (F = mass*acc[2]). The skill explicitly requires both to be present.
      Note: error direction/sign is no longer checked, because sign equivalence makes the judgment unstable.
    signal:
      query: >
        Based on actual code content (code written by Write/Edit tool calls), not the agent's self-statements:
        Does the position controller satisfy both of the following conditions simultaneously:
        (1) the acceleration computation includes a desired_acc feedforward term (i.e. not only PID feedback terms, but also the desired acceleration is added);
        (2) the thrust computation includes gravity compensation (e.g. F = mass*(gravity + acc[2]) or an equivalent form, rather than F = mass*acc[2]).
        Answer YES if both conditions are met: desired_acc feedforward is present in the acceleration computation AND thrust includes gravity compensation.
        Answer NO if desired_acc feedforward is missing (pure PID without feedforward), OR if thrust does not include gravity compensation.
      acceptable: "acc = desired_acc - kp*pos_err - kd*vel_err; F = mass*(g + acc[2]) or any mathematically equivalent form (containing desired_acc and gravity)"
      unacceptable: "acc = -kp*pos_err - kd*vel_err (no desired_acc feedforward); or F = mass*acc[2] (no gravity compensation)"
    review:
      proposed_by: ["drafter", "reviewer_A", "reviewer_B", "reviewer_C"]
      challenged_by: []
      consensus: high

  # ── Task-completion record (not scored) ──

  - id: tc1_task_done
    type: task-completion
    provenance: task
    verifier: llm-judge
    weight: 0
    spec: |
      [TASK — not counted toward SF] Whether the task is complete: can the code generate a results directory for at least one command file,
      containing planned_trajectory.npy, metrics_3d.json, and tuning_results.json.
    signal:
      query: >
        Based on tool-call evidence (actual execution results of Write/Edit/Bash), not the agent's self-statements:
        Did the model successfully create an output directory containing planned_trajectory.npy, metrics_3d.json,
        and tuning_results.json for at least one command file? Can the code run normally (no obvious syntax errors or import failures)?
        Answer YES if the code appears complete and functional for at least one command file, producing the required output files.
        Answer NO if the code has obvious errors preventing execution, or critical output files are missing from the implementation.
      acceptable: "Complete runnable code that generates the three required files under /root/results/{label}/ for each command file"
      unacceptable: "Code is incomplete, has obvious syntax errors, or lacks key function implementations"
