task_id: SF34_t1_azure_bgp_oscillation_route_leak
level: L2
skill_id: skill_34_azure_bgp
description: "Detect BGP route oscillation and leaks in an Azure Virtual WAN network\
  \ topology and evaluate which solutions can fix them.\n\nSteps:\n1. Run `python\
  \ generate_data.py` to produce the analysis input files in `/app/data/`\n2. Load\
  \ and analyze the generated JSON inputs: topology.json (BGP adjacency graph), relationships.json\
  \ (economic relationships per edge), route.json (advertised route), preferences.json\
  \ (routing preferences between hubs), local_pref.json (relationship type weights),\
  \ route_events.json (route propagation evidence), and possible_solutions.json (candidate\
  \ remediations)\n3. Detect in the topology: oscillation and/or route leak events\
  \ violating BGP valley-free routing\n4. When oscillation or route leaks are detected,\
  \ evaluate the possible solutions in the input. Load `possible_solutions.json`.\
  \ For each solution, determine if it resolves oscillation and/or route leaks given\
  \ the observed topology behavior and Azure Virtual WAN operational constraints\n\
  5. Save result to `/app/output/oscillation_report.json` using the format below\n\
  \n```json\n{\n  \"oscillation_detected\": <boolean>,\n  \"oscillation_cycle\":\
  \ [<asn>, ...],\n  \"affected_ases\": [<asn>, ...],\n  \"route_leak_detected\":\
  \ <boolean>,\n  \"route_leaks\": [\n    {\n      \"leaker_as\": <asn>,\n      \"\
  source_as\": <asn>,\n      \"destination_as\": <asn>,\n      \"source_type\": \"\
  <provider|peer|customer>\",\n      \"destination_type\": \"<provider|peer|customer>\"\
  \n    }\n  ],\n  \"solution_results\": {\n    \"<solution description>\": {\n  \
  \    \"oscillation_resolved\": <boolean>,\n      \"route_leak_resolved\": <boolean>,\n\
  \      \"allowed_in_azure\": <boolean>\n    }\n  }\n}\n```"
