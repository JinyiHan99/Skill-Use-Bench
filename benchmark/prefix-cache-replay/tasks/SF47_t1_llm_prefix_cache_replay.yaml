skill_constraints_tested:
- id: c1
  description: Prefix-hit token count must use min(k * block_size, L) to truncate the last incomplete block
  exclusive: Directly returning k * block_size, ignoring the last incomplete block, leads to systematically inflated token counts (auxiliary verification point, medium discriminative power)
- id: c2
  description: Blocks in the Ghost queue do not count toward residency and contribute zero to hit tokens
  exclusive: May treat Ghost as an ordinary cache layer, counting Ghost hits as prefix hits, inflating the hit rate
- id: c3
  description: The frequency counter is clamped to [0, max_freq] (max_freq=1 for this task), clamped after each access
  exclusive: Letting freq grow without bound causes M's second-chance loop to grow longer and longer until it degrades
- id: c4
  description: On Ghost hit, admit to the tail of M with freq=0 (Yang et al. standard variant, not the freq=1 variant)
  exclusive: May admit with freq=1, because some follow-up papers adopt that variant
- id: c5
  description: On S->M promotion, preserve the original freq value, do not reset to 0
  exclusive: May reset freq to 0 at the new-queue entrance, treating it as a fresh admission
- id: c6
  description: ghost_cap = main_cap (= capacity - small_cap), not small_cap
  exclusive: When copying the S eviction rule, it is easy to inadvertently set ghost_cap = small_cap
notes: 'Source: skillsbench/llm-prefix-cache-replay (derived from real LLM serving traces
  in Mooncake/vLLM-style hash_ids format; sanitized excerpt, 2000 requests)

  Domain: other

  Phase1 score: 0.415

  Confidence: 0.88'
