task_id: SF85_t3_order_state_races
skill_id: csharp-concurrency-patterns
level: L3
description: |
  In a high-performance microservice scenario, the order service starts receiving callbacks for inventory confirmation, payment, and shipping concurrently (see `OrderCallbackHandler.cs`). Because these callbacks arrive concurrently and out of order, directly modifying the same order's state concurrently in the event handler leads to serious transition-order conflicts or database concurrency conflicts.

  The material is under `assets/SF85_t3_order_state_races/input/`, containing:
  - `Order.cs` (order domain aggregate root)
  - `OrderCallbackHandler.cs` (concurrent callback entry handler)

  Please focus on refactoring the concurrency boundary of "how callbacks are dispatched by order and single-order sequential processing is guaranteed after a callback enters"; if needed, you may keep `Order.cs`'s state-transition methods largely unchanged and only add minimal necessary interfaces.

  Requirements:
  1. Do not stack temporary critical-section synchronization patches inside the domain object to mask races;
  2. Ensure all callback messages for the same order are fully serialized, so state changes advance in an orderly manner per business rules;
  3. Different orders must be able to be processed in high-concurrency parallel, without introducing any global synchronization bottleneck.

  Please provide the callback dispatch structure, the creation/lookup logic for the single-order processing unit, and the core code skeleton for state advancement in detail.
initial_state:
  assets:
    - path: assets/SF85_t3_order_state_races/input/Order.cs
      source: "dotnet/eShop public repository: src/Ordering.Domain/AggregatesModel/OrderAggregate/Order.cs, https://github.com/dotnet/eShop/blob/main/src/Ordering.Domain/AggregatesModel/OrderAggregate/Order.cs"
      real_state: "A real eShop ordering domain aggregate with status transition methods such as SetAwaitingValidationStatus, SetStockConfirmedStatus, SetPaidStatus, SetShippedStatus, and SetCancelledStatus."
