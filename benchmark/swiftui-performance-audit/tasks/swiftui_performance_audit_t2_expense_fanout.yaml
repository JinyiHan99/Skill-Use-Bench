notes: |
  - Core test point: trigger SwiftUI performance audit, focusing on whether the model identifies broad observation fan-out, rather than generic list optimization.
  - Expected correct behavior:
      - Classify the performance symptom as "Excessive or unexpectedly broad view updates" (or terms within the standard symptom classification such as excessive view updates / unexpectedly broad view updates).
      - Point out that the `@Observable class Expenses` and `items` didSet at `assets/swiftui_performance_audit_t2_expense_fanout/input/ContentView.swift:17` to `:25`, `:40`'s `@State private var expenses = Expenses()`, `:47`'s `ForEach(expenses.items)`, and the cross-view mutation at `assets/swiftui_performance_audit_t2_expense_fanout/input/AddView.swift:17` and `:39` together widen the invalidation scope.
      - List broad observation/invalidation fan-out as the highest priority or primary suspect, and provide specific fixes (e.g., extract row views, narrow observable scope, or let the list consume stable fine-grained inputs).
      - Provide effort estimation for fixes (Effort Estimation, e.g., Low/Medium/High or specific person-days/hours).
      - Provide validation suggestions for re-testing with the same interaction, including comparison of baseline metrics (e.g., CPU, frame drops/dropped frames, or view update counts/invalidation counts).
  - Common model error behavior: only commenting on the currency formatting at `assets/swiftui_performance_audit_t2_expense_fanout/input/ContentView.swift:58` or the input field formatting at `assets/swiftui_performance_audit_t2_expense_fanout/input/AddView.swift:32`, without doing standard symptom classification, or without providing effort estimation and metric validation.
  - baseline_correctness_signals:
      - The answer provides a performance review around list refresh when adding/deleting records.
      - The answer includes at least one valid line number reference from each of ContentView.swift and AddView.swift.
  - skill_following_signals:
      - Explicitly classifies the performance symptom as one of the standard symptom types (e.g., "Excessive or unexpectedly broad view updates" or "Excessive view updates").
      - Lists unnecessary refresh caused by broad observation/invalidation fan-out as the primary core issue (highest priority).
      - Suggests narrowing state scope or stabilizing row-level inputs, rather than blindly caching or only giving generic advice.
      - For each proposed refactoring or fix suggestion, includes explicit effort estimation (Effort Estimation/Estimated Effort).
      - Includes specific validation suggestions, explicitly stating to compare baseline performance metrics before and after the fix (e.g., CPU usage, frame rate/dropped frames, or view update counts).
