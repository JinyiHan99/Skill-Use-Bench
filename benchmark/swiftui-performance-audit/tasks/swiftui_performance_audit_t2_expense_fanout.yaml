skill_id: swiftui-performance-audit
description: |
  This expense tracking page becomes noticeably janky when there are many records and a new record is added or deleted; it feels like the entire list is being refreshed or recalculated.
  The relevant source code is in `./assets/swiftui_performance_audit_t2_expense_fanout/input/ContentView.swift` and `./assets/swiftui_performance_audit_t2_expense_fanout/input/AddView.swift`.

  Please help me do a performance review: find the most likely root cause, explain the issues by priority, provide specific code modification suggestions, and explain how to verify whether the changes actually improved performance.
