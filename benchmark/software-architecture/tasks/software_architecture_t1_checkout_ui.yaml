skill_constraints_tested:
  - id: decompose_long_components_and_functions
    description: "The skill requires long components/functions over 80 lines to be decomposed into smaller focused functions, and files over 200 lines to be split when the code cannot stay focused in one file."
    exclusive: "Without the skill, a strong model may still perform some local extraction inside `src/hooks/useShippingAddress.js`, but it is unlikely to consistently satisfy the skill’s structural thresholds at the same time: reducing the primary edited callback below 80 lines, keeping the file focused below 200 lines or splitting it, and separating shipping-address responsibilities into bounded, domain-named modules. The skill makes those structural constraints explicit; generic refactoring habits do not."
  - id: early_returns_and_nesting_limit
    description: "The skill requires early returns where possible and avoiding deep nesting, with complex logic broken into focused pieces."
    exclusive: "Early returns alone are not strongly skill-exclusive because many capable models already prefer guard-clause refactors. This signal should be evaluated only in combination with the skill’s stronger architecture requirements, such as focused module decomposition and domain-specific naming. A useful concrete observation point is whether the redundant nested `if (shippingAddressData.country_code)` flow around `src/hooks/useShippingAddress.js:192` is flattened or delegated, since `country_code` is already pre-validated earlier in the callback."
  - id: domain_specific_module_names
    description: "The skill prohibits generic module names such as utils/helpers/common/shared and calls for bounded-context names with one clear purpose."
    exclusive: "The source tree already contains `src/hooks/shared/`, which creates a strong default path for non-skill-driven refactors. Without the skill, a capable model may reasonably continue that pattern by adding more shipping-related exports under `src/hooks/shared/` or creating a file such as `shippingHelpers.js`. The skill creates a different expectation: bounded, checkout-domain-specific modules whose names clearly express one responsibility."
notes: |
  - Core test point: this is a maintainability-oriented software development task where preserving behavior is not enough; the model should apply the skill's structural rules to the real checkout hook.
  - Expected correct behavior: extract shipping address validation, default shipping-line selection, billing-address sync, and tax update work into small domain-named functions/modules; use early returns to reduce nesting; keep business behavior equivalent.
  - Common wrong behavior: the model performs only local cleanup inside `useShippingAddress.js`—for example extracting a few inline helpers but keeping the file as the main dumping ground, or continuing to place newly extracted responsibilities under `src/hooks/shared/`. This preserves behavior but misses the architecture skill’s stronger decomposition and naming requirements.
  - Common wrong behavior: the model creates `src/hooks/shared/shippingHelpers.js` or adds exports to `src/utils/index.js`, violating the skill's generic naming prohibition.
  - baseline_correctness_signals:
      - The project tree under `./assets/software_architecture_t1_checkout_ui/input/` still contains the checkout source and modified files are syntactically valid JavaScript/JSX.
      - Shipping-address behavior remains represented: required fields, country/province/postal-code checks, shipping-line selection, billing-same-as-shipping, and tax generation are not removed.
  - skill_following_signals:
      - The primary shipping-address orchestration logic is no longer concentrated in a single >200-line file: either `src/hooks/useShippingAddress.js` is reduced below 200 lines, or at least one shipping-address-specific module is introduced and the main file delegates to it.
      - The main shipping-address submission callback after editing is under 80 lines, and any newly introduced helper in modified files is also under 80 lines.
      - Around shipping-line handling, the main flow no longer depends on adding deeper nested conditionals in the original callback; instead, it is either flattened with guard clauses or delegated into a focused helper/module.
      - Newly created or newly edited extraction modules must use domain-specific names and must not add new responsibilities to generic `utils`, `helpers`, `common`, or `shared` dumping grounds. Existing upstream files under `src/hooks/shared/` are baseline assets and should not be penalized unless the model expands that generic pattern.
  - partial_skill_following_signals:
      - At least one distinct responsibility, such as validation, shipping-line selection, billing sync, or tax update, is extracted out of the main shipping-address callback into a focused function or domain-named module.
      - The main callback becomes shorter even if the full decomposition is incomplete.
      - Newly added modules do not use generic names such as `utils`, `helpers`, `common`, or `shared`.
