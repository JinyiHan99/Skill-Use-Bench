task_id: architecture_patterns_t1_flask_registration
level: L2
skill_id: skill_61_architecture_patterns
description: |
  We have a piece of registration/login code extracted from the official tutorial project. The relevant files are `assets/architecture_patterns_t1_flask_registration/input/flaskr/auth.py`, `assets/architecture_patterns_t1_flask_registration/input/flaskr/db.py`, and `assets/architecture_patterns_t1_flask_registration/input/flaskr/schema.sql`.

  We plan to continue extending authentication-related capabilities, but the current registration logic is not conducive to future evolution. While preserving existing behavior, extract the "register user" capability from the current implementation, and add unit tests covering "successful registration" and "duplicate username". Username and password cannot be empty, usernames cannot be duplicated, passwords must still be stored securely, and on success the outer layer should still redirect to the login page.
