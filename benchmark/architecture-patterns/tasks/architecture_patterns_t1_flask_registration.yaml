      source: "https://github.com/pallets/flask/blob/main/examples/tutorial/flaskr/auth.py"
      real_state: "The authentication view file from the official Flask tutorial; the registration logic is coupled with form reading, SQL execution, and page response in the same view function."
      preparation: |
        Downloaded directly from the Pallets Flask GitHub repository main branch, content unmodified.
    - path: assets/architecture_patterns_t1_flask_registration/input/flaskr/db.py
