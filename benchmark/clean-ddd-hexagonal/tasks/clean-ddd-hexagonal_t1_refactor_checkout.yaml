task_id: clean-ddd-hexagonal_t1_refactor_checkout
skill_id: clean-ddd-hexagonal
description: |
  We are about to develop a Corporate Checkout API flow exclusive to enterprise customers for the sample mall. Enterprise customer checkout has the following specific business rules:
  1. A Corporate ID (CorporateId) and a Purchase Order Number (PurchaseOrderNumber) must be provided.
  2. Enterprise credit-limit validation is required: the system must verify whether the order total exceeds the enterprise's current credit limit (CreditLimit; e.g., enterprise 'CORP_001' has a credit limit of 5000.00, others default to 0). If the limit is exceeded, reject the checkout and return an appropriate error.
  Please implement the corporate checkout API interface under `assets/clean-ddd-hexagonal_t1_refactor_checkout/input/`. Ensure the new code structure is clear, easy to test, and does not affect the existing normal checkout flow.
  Briefly describe the main changes, the modules involved, and the verification method in `output/checkout-refactor-notes.md`.
