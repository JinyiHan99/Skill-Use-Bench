task_id: python_project_structure_t2_packaging_reorg
skill_id: python-project-structure
description: |
  This version and dependency rule processing code has recently been referenced by several projects at once; the maintaining colleague feels the modules are too fragmented and the entry points are inconsistent, and some people have misused internal helpers. The team wants to organize it into a small library that is easier for other code to depend on. Based on the code in `assets/python_project_structure_t2_packaging_reorg/input/packaging/`, reorganize it into a clearer importable package structure in whatever way you think is appropriate, so that users can more easily see the stable import entry points and which implementation details should not be depended on externally. Place the result in `output/packaging_refactor/`, and add an `output/structure_notes.md` briefly explaining the external entry points and internal boundaries.
