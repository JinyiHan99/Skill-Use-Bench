task_id: docs_writer_t1_quota_refresh
skill_id: docs-writer
description: |
  We are preparing a short update for the Gemini CLI docs after the billing flow
  changed. The existing page in `assets/docs_writer_t1_quota_refresh/input/docs/resources/quota-and-pricing.md`
  still talks about running out of requests in a way that doesn't match the code
  anymore.

  Please update that page so users can quickly understand what happens when
  their included usage runs out but they still have eligible credits available.
  Make the credit-based continuation path easy to notice as a short note in the
  updated section, and keep any added references or links consistent with the
  rest of the Gemini CLI docs.

initial_state:
  assets:
    - path: assets/docs_writer_t1_quota_refresh/input/docs/resources/quota-and-pricing.md
      source: "https://github.com/google-gemini/gemini-cli/blob/ae0a3aa7b928cc73bb09604bb9c2c020e6b647db/docs/resources/quota-and-pricing.md"
      real_state: "Real Gemini CLI documentation page about quotas and pricing; it contains older wording around pay-as-you-go and quota exhaustion."
      preparation: |
        Cloned google-gemini/gemini-cli at commit ae0a3aa7b928cc73bb09604bb9c2c020e6b647db and copied this file without content changes.
    - path: assets/docs_writer_t1_quota_refresh/input/docs/cli/custom-commands.md
      source: "https://github.com/google-gemini/gemini-cli/blob/ae0a3aa7b928cc73bb09604bb9c2c020e6b647db/docs/cli/custom-commands.md"
      real_state: "Real Gemini CLI documentation page used as a style and cross-link reference."
      preparation: |
        Cloned google-gemini/gemini-cli at commit ae0a3aa7b928cc73bb09604bb9c2c020e6b647db and copied this file without content changes.
    - path: assets/docs_writer_t1_quota_refresh/input/packages/core/src/billing.ts
      source: "https://github.com/google-gemini/gemini-cli/blob/ae0a3aa7b928cc73bb09604bb9c2c020e6b647db/packages/core/src/billing/billing.ts"
      real_state: "Real Gemini CLI billing implementation defining credit overage behavior and terminology."
      preparation: |
        Cloned google-gemini/gemini-cli at commit ae0a3aa7b928cc73bb09604bb9c2c020e6b647db and copied the implementation file into a shorter package path for the task bundle.
  tools_available:
    - read_file
    - list_directory
