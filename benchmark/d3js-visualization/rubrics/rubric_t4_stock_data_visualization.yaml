# Rubric for SF43_t4_stock_data_visualization
# Skill: D3.js Visualization — deterministic, offline, vendored D3
# Note: Task says "works entirely offline" and specifies output/ directory without fixed sub-paths

# ── GATE ──
- id: g1_observable_attempt
  type: required-tool
  provenance: gate
  verifier: regex
  weight: 0
  signal:
    pattern: "Write|Edit"
  spec: "[GATE] The trace contains an observable file write operation (Write or Edit tool call)"

# ── Skill-Following rules (scored) ──

- id: r1_no_cdn_local_vendor
  type: forbidden-arg
  provenance: skill
  verifier: state-diff
  exclusive: true
  weight: 1.0
  spec: |
    [SKILL] Loading D3 from CDN is prohibited; must be imported via a local vendor file.
    skill-exclusive reason: without reading the skill, a strong model defaults to importing D3 from CDN (e.g., https://d3js.org/d3.v7.min.js or unpkg/cdnjs),
    only by following the skill will it create a local vendor file and reference it with a relative path.
  signal:
    file: "output/index.html"
    file_must_not_contain: "https?://"

- id: r2_d3_version_pinned_790
  type: required-arg
  provenance: skill
  verifier: llm-judge
  exclusive: true
  weight: 1.0
  spec: |
    [SKILL] D3 must be precisely pinned to v7.9.0; the vendor filename or reference path must include 7.9.0.
    skill-exclusive reason: without reading the skill, the model only uses coarse-grained version references like d3.v7 or d3@7, and will not spontaneously pin to the exact patch version 7.9.0.
  signal:
    query: >
      In the agent's tool call trace, examine the file contents actually written via Write or Edit tools (including HTML, JS files, and files under the created vendor directory).
      Is the D3.js version explicitly pinned to 7.9.0? Judgment basis includes: vendor filename contains "7.9.0" (e.g., d3.v7.9.0.min.js),
      or the script src path in HTML/JS contains "7.9.0", or code comments explicitly declare pinning to d3@7.9.0.
      Look only at the file contents actually written by Write/Edit tool calls, not at the agent's self-report or explanations.
      Answer YES if the D3 version is explicitly pinned to 7.9.0 in the output files.
      Answer NO if the version is unspecified, uses a different version, or only uses coarse references like "d3.v7" or "d3@7".
    acceptable: "Filename is d3.v7.9.0.min.js or script src contains 7.9.0"
    unacceptable: "Uses d3.v7.min.js, d3.min.js, or versionless reference"
  review:
    proposed_by: ["drafter"]
    challenged_by: []
    consensus: high

- id: r3_no_d3_transition
  type: forbidden-arg
  provenance: skill
  verifier: llm-judge
  exclusive: true
  weight: 1.0
  spec: |
    [SKILL] Using D3's transition/animation API (.transition()) is prohibited.
    skill-exclusive reason: D3 is known for animations; a strong model habitually adds .transition().duration() for effects when implementing bubble chart linked interactions.
    Only by following the skill will it completely avoid the D3 transition API. CSS transitions (e.g., tooltip opacity) are not in the prohibited scope.
    Note: This task does not enforce the output/js/visualization.js path; JS may be in other files.
  signal:
    query: >
      In all JavaScript files and HTML files actually written by the agent via Write/Edit tools, is D3's .transition() API used?
      Judgment basis: check whether .transition() calls appear in JS/HTML files (e.g., selection.transition().duration(...)).
      CSS transition properties do not count as violations. Look only at the file contents actually written by Write/Edit tool calls, not at the agent's self-report.
      Answer YES if NO .transition() D3 API call appears in the JavaScript code (i.e., the skill rule is followed).
      Answer NO if .transition() is used in JavaScript code (the skill rule is violated).
    acceptable: "No .transition() call in JS code, only CSS transition property"
    unacceptable: "D3 transition calls like d3.select(...).transition().duration(500) appear in JS"
  review:
    proposed_by: ["drafter"]
    challenged_by: []
    consensus: high

- id: r4_force_layout_fixed_ticks
  type: lesson
  provenance: skill
  verifier: llm-judge
  exclusive: true
  weight: 1.0
  spec: |
    [SKILL] Force-directed layout (force simulation) must fix N iterations and fix initial positions; convergence-based stopping (on('tick') running until alpha converges) is prohibited.
    skill-exclusive reason: the D3 force simulation standard paradigm is sim.on('tick', ticked) letting the layout run until alphaMin automatically stops,
    only by following the skill will it switch to simulation.tick(N) for precomputing a fixed number of steps and then manually rendering.
  signal:
    query: >
      In the JavaScript files actually written by the agent via Write/Edit tools, examine the force-directed layout (d3.forceSimulation) implementation.
      Does it satisfy the following conditions: (1) uses simulation.tick(N) or equivalent to precompute a fixed number of steps, rather than relying on the on('tick') event for continuous rendering until convergence;
      (2) node initial positions are deterministically set (e.g., grid positions based on sorting, index-based positions), rather than random.
      Look only at the JS file contents actually written by Write/Edit tool calls, not at the agent's self-report.
      Answer YES if the force layout uses a fixed number of tick iterations (e.g., simulation.tick(300)) AND sets deterministic initial positions.
      Answer NO if it uses on('tick', ...) for real-time rendering until convergence, OR initial positions are random/undefined.
    acceptable: "simulation.tick(300); then bind coordinates and render at once — initial positions based on sector grouping or sort index"
    unacceptable: "simulation.on('tick', function() { ... }) continuous rendering; or initial node.x/node.y not set"
  review:
    proposed_by: ["drafter"]
    challenged_by: []
    consensus: high

- id: r5_tooltip_pattern_skill
  type: lesson
  provenance: skill
  verifier: llm-judge
  exclusive: true
  weight: 0.5
  spec: |
    [SKILL] Tooltip must use the .visible class toggle pattern specified by the skill (opacity 0/1 + .classed('visible', true/false)).
    skill-exclusive reason: without reading the skill, the model will use display:none/block or directly .style('opacity', 1) to control tooltip visibility,
    only by following the skill will it use the combined pattern of .visible CSS class + .classed() method.
  signal:
    query: >
      In the CSS and JS files actually written by the agent via Write/Edit tools, is tooltip visibility controlled by adding/removing the CSS class "visible"?
      Judgment basis: (1) the CSS file defines .tooltip.visible or .visible style rules that change opacity;
      (2) the JS file uses .classed('visible', true/false) to toggle tooltip visibility.
      Look only at the file contents actually written by Write/Edit tool calls, not at the agent's self-report.
      Answer YES if tooltip uses a .visible CSS class toggled via .classed() in JS.
      Answer NO if tooltip uses display:none/block, or directly sets .style('opacity') without a CSS class, or uses other show/hide mechanisms.
    acceptable: "CSS: .tooltip.visible { opacity: 1; } — JS: d3.select('#tooltip').classed('visible', true)"
    unacceptable: "JS: tooltip.style('display', 'block') or tooltip.style('opacity', 1) without CSS class"
  review:
    proposed_by: ["drafter"]
    challenged_by: []
    consensus: medium

- id: r6_vendor_directory_structure
  type: required-arg
  provenance: skill
  verifier: llm-judge
  exclusive: true
  weight: 0.75
  spec: |
    [SKILL] D3 must be vendored under the vendor/ directory (e.g., vendor/d3.v7.9.0.min.js), not placed in js/ or other locations.
    skill-exclusive reason: the skill explicitly specifies "Prefer vendoring a minified D3 bundle (e.g., vendor/d3.v7.9.0.min.js)",
    a model not reading the skill will place D3 in js/lib/ or inline it directly.
  signal:
    query: >
      In the files actually written by the agent via Write/Edit tools, is the D3 library file placed in a directory named "vendor"?
      Judgment basis: check whether the file path created by the Write tool includes a vendor/ directory, or whether the script src in HTML references a D3 file under the vendor/ path.
      Look only at the actual file paths and contents from Write/Edit tool calls, not at the agent's self-report.
      Answer YES if D3 is placed in a vendor/ directory (e.g., vendor/d3.v7.9.0.min.js or output/vendor/d3.v7.9.0.min.js).
      Answer NO if D3 is placed elsewhere (js/, lib/, inline, node_modules/) or loaded from CDN.
    acceptable: "Write tool path is output/vendor/d3.v7.9.0.min.js or vendor/d3.v7.9.0.min.js"
    unacceptable: "D3 file placed at output/js/d3.min.js or inlined in HTML"
  review:
    proposed_by: ["drafter"]
    challenged_by: []
    consensus: medium

# ── Task completion record (not scored) ──
- id: tc1_task_done
  type: task-completion
  provenance: task
  verifier: state-diff
  weight: 0
  spec: "[TASK — not counted toward SF] Whether the task core product output/index.html exists and contains D3 visualization content"
  signal:
    file: "output/index.html"
    file_must_contain: "<svg"
