skill_constraints_tested:
- id: c1
  description: Loading D3 from CDN is prohibited; must use local vendored files
  exclusive: When the description does not enforce a specific D3 local filename, a strong model naturally prefers CDN (<script src="https://d3js.org/d3.v7.min.js">). The Skill requires offline vendoring.
- id: c2
  description: Pin D3 exact version to v7.9.0, filename reflects the exact version number
  exclusive: The model typically only writes coarse-grained version references like d3.v7 or d3@7, and will not spontaneously pin to the exact patch version v7.9.0
- id: c3
  description: All transitions/animations are prohibited by default, including runtime tick animation of force-directed layout
  exclusive: c3 alone has medium distinguishing power; combined with c4 it forms the "fully static deterministic rendering" constraint, which has strong distinguishing power. A model not reading the skill may happen to not write .transition(), but will produce runtime layout animation through on("tick")
- id: c4
  description: Force-directed layout must fix N iterations and fix initial positions; convergence-based stopping is prohibited
  exclusive: The D3 force simulation standard paradigm is sim.on('tick') running until alpha converges
