skill_constraints_tested:
- id: c1
  description: Loading D3 from CDN is prohibited; must use local vendoring (vendor/d3.v7.9.0.min.js)
  exclusive: A strong model defaults to loading D3 from CDN (e.g., d3js.org or unpkg); only after reading the skill will it choose local vendoring to the vendor/ directory
- id: c2
  description: Pin D3 exact version to v7.9.0, and write it into the vendor filename
  exclusive: The model defaults to using the latest version or coarse-grained version references (e.g., d3.v7 or d3@latest), and will not precisely pin to 7.9.0
- id: c3
  description: Transitions/animations are prohibited by default (regardless of whether the task says static)
  exclusive: D3 is known for animations; a strong model writing D3 will naturally add .transition() for effects
- id: c4
  description: Force-directed layout must fix N iterations and fix initial positions; convergence-based stopping is prohibited
  exclusive: The D3 force simulation standard paradigm is sim.on('tick') running until alpha converges
