task_id: SF43_t5_stock_data_visualization
level: L2
skill_id: skill_43_d3_visualization
description: "Please build a single-page web application using **D3.js** to visualize stock-related data. The final output\
  \ should be accessible at:\n\n- `output/index.html` (viewable in a web browser)\n\n---\n\n## \U0001F4C1 Project Structure\
  \ Requirements\n\nEnsure the following files and directories are created:\n\n- `output/js/visualization.js`\
  \  \n- `output/css/style.css`  \n- `output/data/` → copy all provided input datasets into this directory  \n\
  \n---\n\n## \U0001F4CA Data Sources\n\nUse the following datasets:\n\n- `assets/SF43_t5_stock_data_visualization/data/stock-descriptions.csv` → contains company\
  \ metadata  \n- `assets/SF43_t5_stock_data_visualization/data/indiv-stock/` → contains individual stock price histories  \n\n---\n\n## \U0001F4C8 Visualization\
  \ Layout\n\nThe application should display **two components arranged horizontally side by side**:\n\n1. A **bubble chart**\
  \  \n2. A **data table** listing all 50 entries (stocks and ETFs)  \n\n---\n\n## \U0001F4CB Data Table Requirements\n\nThe table must include\
  \ these columns: \"Ticker symbol\", \"Full company name\", \"Sector\", and \"Market cap\" (it should be formatted as an\
  \ easy-to-read number e.g., \"1.64T\")\n\nInteraction requirements:\n\n- Clicking a table row highlights the corresponding\
  \ bubble  \n- Clicking a bubble highlights the corresponding table row  \n\n---\n\n## \U0001F7E2 Bubble Chart Requirements\n\
  \nEach bubble represents a **single stock**, with the following attributes:\n\n- **Size**: proportional to market capitalization\
  \  \n  - ETFs do not have market cap → assign them a uniform size  \n- **Color**: based on sector  \n- **Label**: display\
  \ the ticker symbol inside each bubble  \n\n---\n\n## Layout\n\n- Bubbles representing stocks in the same sector should be visually grouped together\n\
  - Keep groups centered and compact, with no overlapping between bubbles\n- The bubble layout must be stable and fully reproducible across page reloads given the same input data\n\
  \n---\n\n## \U0001F3F7\
  ️ Tooltip Behavior\n\n- On hover, display a tooltip showing:\n  - ticker  \n  - company name  \n  - sector  \n- **Do not\
  \ display tooltips for ETFs** (they lack marketCap, country, and website data)\n\n---\n\n## ⚠️ Critical Constraints\n\n\
  - **All text must be displayed in full without truncation**\n\n\n## \U0001F9E9 Legend Requirement\n\n- Include a legend\
  \ that maps colors to sectors  \n\n---"
