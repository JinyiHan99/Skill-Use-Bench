task_id: SF43_t3_stock_data_visualization
level: L2
skill_id: skill_43_d3_visualization
description: "Please use D3.js to visualize input data stored at `assets/SF43_t3_stock_data_visualization/data/stock-descriptions.tsv`\
  \ and `assets/SF43_t3_stock_data_visualization/data/indiv-stock/`\
  \ for company stock details and individual stock price histories.\nPlease return the output as a single-page web app at\
  \ `output/index.html`. I should be able to open it in a web browser.\nAlso make sure to generate files organized in\
  \ the paths below to support this web app:\n- output/js/visualization.js\n- output/css/style.css\n\
  - output/data/: copy the provided input data\n\nThis web-app should visualize the below two charts arranged side\
  \ by side horizontally:\n- A bubble chart where each bubble maps to one stock:\n   1. The bubbles should be sized by market\
  \ capitalization (use larger bubble for larger market cap). ETFs don't have market cap data, so size them uniformly\n  \
  \ 2. The bubbles should be colored by their corresponding sector. Bubbles belonging to the same sector should be grouped\
  \ into distinct, well-centered clusters. Add a clear legend showing the sector name for each color.\n   3. The clusters\
  \ for each sector should be close together and centered\
  \ reasonably in the chart (not scattered far away).\n   4. Ensure bubbles do not overlap each other.\n\
  \   5. Each bubble should be labeled by its ticker symbol inside\n   6. When I hover over bubbles, it should show a tooltip\
  \ with the bubble's ticker, name, and sector. (Note: ETF entries have no marketCap, country, or website data, so do not\
  \ show tooltip for them)\n- A data table next to the bubble chart listing all 50 entries (stocks and ETFs) with these columns: \"Ticker symbol\"\
  , \"Full company name\", \"Sector\", and \"Market cap\" (it should be formatted as an easy-to-read number e.g., \"1.64T\"\
  )\n- Also add functionality to connect the bubble chart and table: when user clicks a bubble, its row should be at the same\
  \ time highlighted in the table, and vice versa.\n- All text must be displayed in full without truncation.\n\
  The bubble layout must be fully deterministic: given the same input data, bubble positions must be identical and stable across\
  \ page reloads. The chart must render in its final static state immediately on page load, with no entry animations or layout transitions."
