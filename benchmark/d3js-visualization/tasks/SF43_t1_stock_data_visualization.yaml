skill_constraints_tested:
- id: c1
  description: Loading D3 from CDN is prohibited; must use local vendoring and place in vendor/ directory
  exclusive: When the description no longer specifies the exact JS dependency file path, the model defaults to importing D3 from CDN; only by following the Skill will it proactively vendor
- id: c2
  description: Pin D3 exact version to v7.9.0, vendor filename includes version number (e.g., vendor/d3.v7.9.0.min.js)
  exclusive: When the version is not specified, the model typically uses latest d3 or coarse-grained d3@7 reference; only by following the Skill will it precisely lock to 7.9.0 and reflect it in the filename
- id: c3
  description: Transitions/animations are prohibited by default (regardless of whether the task says static)
  exclusive: When implementing D3 bubble chart linked interactions, a strong model habitually adds .transition().duration() to hover/click effects; only by following the Skill will it completely avoid the D3 transition API (CSS transitions are allowed)
- id: c4
  description: Force-directed layout must fix N iterations and fix initial positions; convergence-based stopping is prohibited
  exclusive: The D3 force simulation standard paradigm is sim.on('tick') running until alpha converges
