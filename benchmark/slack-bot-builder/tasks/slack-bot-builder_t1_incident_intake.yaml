skill_constraints_tested:
  - id: lazy_or_async_slow_task_handling
    description: "Interactive Slack requests and modal submissions must acknowledge before any potentially slow persistence or notification work; slow follow-up work should run outside the blocking interaction path, such as through Bolt lazy listeners or background threads."
    exclusive: "Without the skill, models may implement persistence or notification logic directly inside slash command or modal submission handlers and overlook Slack's strict interactive acknowledgment window. The skill emphasizes separating quick acknowledgment from slower follow-up work."
  - id: typed_modal_value_extraction
    description: "Modal state extraction must correctly target specific nested elements in view.state.values according to block_id and action_id, handling both plain_text_input (value field) and static_select (selected_option.value) appropriately."
    exclusive: "Generic implementations tend to oversimplify value extraction or assume flat dictionary key lookups, missing the nested block_id/action_id/type-specific field structure shown in the skill patterns."
  - id: no_sensitive_payload_logging
    description: "Production code must not retain middleware or handler-level logging that records the full Slack request payload or full request body."
    exclusive: "Models adapting official examples often preserve debug middleware or handler logs that print complete request bodies unless they recognize Slack payload logging as a production security anti-pattern."
notes: |
  - Core test point: refactor a real Bolt Python example into a short-command-triggered incident-intake flow, with input fields (title, service, severity, description), and safely handle time-consuming tasks in background async/multi-threaded manner while sending a DM confirmation to the user.
  - Expected correct behavior:
    - The output directory `output/incident_intake/` contains runnable Python code and dependency descriptions.
    - Both the short-command handler and the view-submission handler prioritize calling `ack()` within the 3-second acknowledgment window.
    - If the simulated save or send operation is slow, it should be placed in a background thread or lazy handler.
    - On view submission, use callback_id binding, and read each field from `view["state"]["values"]` via exact block_id/action_id (especially the static_select value for severity and the value field for text inputs).
    - Credentials are obtained via environment variables, not hardcoded.
    - Thoroughly remove the example's debug middleware that prints the full body, ensuring log safety.
  - Common model error behaviors (specific counter-examples):
    - Synchronously running time-consuming operations in `handle_incident_command()` or the view-submission callback, or doing processing before calling `ack()`, causing Slack to trigger a 3-second timeout.
    - Using non-standard simple dictionary lookups when handling modal submission, e.g. directly taking `body["title"]`.
    - Retaining the `@app.middleware` from `lazy_modals_app.py` that records the full body data, causing signatures or sensitive credential info to leak in logs.
  - baseline_correctness_signals:
      - `output/incident_intake/` contains Python source and necessary dependency notes.
      - The source includes short-command entry, modal-open logic, and submission-handling logic.
      - Incident field names match the scenario: title, service, severity, description.
      - After submission, a DM confirmation is sent to the current user via `chat_postMessage(channel=body["user"]["id"], ...)`.
  - skill_following_signals:
      - Asynchronous slow-logic handling: after `ack()`, use a background thread (e.g. `threading.Thread`) or Bolt's `lazy` decorator to run follow-up processing such as simulated DB writes/notifications, without putting time-consuming work in the synchronous main flow.
      - Correctly extract fields by type: extract the severity static_select's `selected_option["value"]`, and the plain_text_input's `value`.
      - Security design: no Slack credentials are hardcoded in the code, and the `log_request` debug global middleware that outputs the entire `body` to logs has been removed, preventing sensitive payload leakage.
  - evaluation_hints:
      - Check the places in the code that handle slash command and view submission, verifying whether the `ack()` call comes before potentially time-consuming methods (e.g. DB save, external API requests), or whether `lazy` listeners/threads are used for async.
      - Check modal extraction: confirm that for `static_select` it uses `["selected_option"]["value"]`, and for `plain_text_input` it uses `["value"]`.
      - Confirm the `@app.middleware` part has been fully removed or modified to no longer output debug logs of the entire `body` payload.
      - In addition to the global `@app.middleware`, also check whether there is logic such as `logger.info(body)`, `logger.debug(body)`, `print(body)` etc. in command handlers, view-submission handlers, or helper functions that outputs the complete Slack request body.
