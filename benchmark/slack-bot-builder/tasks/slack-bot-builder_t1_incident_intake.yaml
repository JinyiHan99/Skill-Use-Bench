task_id: slack-bot-builder_t1_incident_intake
skill_id: slack-bot-builder
description: |
  Our on-call team wants to turn an existing Slack sample into an "incident intake" entry: colleagues type a short command in Slack, then fill in the incident title, service, severity, and description; after submission, the incident information needs to be saved to a backend, and the save process may be slow, but the submission flow in Slack must not show the user a timeout or failure prompt. The submitter should receive a direct-message confirmation containing the incident title and severity.
  Based on the existing examples and docs in `./assets/slack-bot-builder_t1_incident_intake/input/`, deliver production-ready runnable refactored code, and place the main files you changed in `output/incident_intake/`.
