task_id: slack-bot-builder_t5_slack_docs_brief
skill_id: slack-bot-builder
description: |
  I am preparing an internal briefing for new colleagues and want to explain the concepts of "commands" and "real-time connection modes" in Slack more clearly. Please read the materials in `assets/slack-bot-builder_t5_slack_docs_brief/input/`, and organize them into a Chinese briefing for product and operations colleagues, focusing on use cases, configuration entry points, and common misunderstandings. Save the result to `output/slack_docs_brief/brief.md`.
