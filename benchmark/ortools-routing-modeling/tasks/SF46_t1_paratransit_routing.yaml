skill_constraints_tested:
- id: c1
  description: When modeling shared external depots as per-vehicle starts and ends in a matrix-based RoutingModel, create explicit per-vehicle internal start and end depot copies, build the expanded internal travel-time matrix, and map depot copies back to the shared external depot IDs when reporting.
  exclusive: Without the skill, a model is more likely to reuse the shared depot node IDs directly in the RoutingIndexManager starts/ends arrays, often relying on Python callbacks or implicit node mapping instead of reconstructing a cloned-depot internal matrix.
- id: c2
  description: Prefer precomputed RegisterTransitMatrix and RegisterUnaryTransitVector over Python callbacks for static integer
    data. Routing callbacks are called very often during local search and can consume substantial solve time on large instances.
  exclusive: Without the skill, a model commonly follows OR-Tools tutorial-style Python transit and demand callbacks, rather than precomputing static integer matrices/vectors and registering them directly.
- id: c3
  description: Deliberately set fix_start_cumul_to_zero=False in AddDimension call. Use vehicle start time windows or allowed
    start values instead, especially when vehicle start times or shifts may vary.
  exclusive: Model would use the OR-Tools default fix_start_cumul_to_zero=True (shortest-path behavior) without considering
    the implications for shift-based or variable-start-time routing problems.
