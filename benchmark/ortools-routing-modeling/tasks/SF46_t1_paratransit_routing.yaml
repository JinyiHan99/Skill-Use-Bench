task_id: SF46_t1_paratransit_routing
level: L2
skill_id: skill_46_ortools_routing_modeling
description: 'You are a paratransit planner preparing the operating plan for a day
  of door-to-door ride requests. Produce vehicle routes and shift starts that serve
  as many trips as possible while respecting the operating rules.


  Please refer to `assets/SF46_t1_paratransit_routing/model-and-data.md` for the
  data conventions, feasibility rules, and output format. Write the final plan to
  `report.json` in the working directory.


  The instance has 40 passengers, 84 trips, and 8 vehicles. Keep the optimization
  search bounded so there is still time for data loading, route extraction,
  independent auditing, and report writing.'
