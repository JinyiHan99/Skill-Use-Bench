task_id: soul_memory_t2_cantonese_priority
skill_id: skill_98_soul-memory
description: |
  While using this memory component to organize mixed Chinese-English-Cantonese conversation snippets, I found that its judgment of "which content is worth remembering long-term, which is just casual chatter, and which carries obvious Cantonese tone" is not stable enough. Based on the modules related to priority, dynamic classification, and Cantonese grammar in `assets/soul_memory_t2_cantonese_priority/input/soul-memory-snapshot/`, please stabilize the judgment logic, and compile the actual outputs of several representative samples into `output/` for my review.
