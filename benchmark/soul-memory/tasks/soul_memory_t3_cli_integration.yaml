skill_constraints_tested:
  - id: cli_contract_for_external_integration
    description: "When the command-line entry point serves as the external integration interface for soul-memory, callers should be able to reliably consume the same type of main return in normal, empty-result, and failure scenarios; internal initialization information, diagnostic information, and exception descriptions must not pollute the main result read by callers."
    exclusive: "Without reading the skill, the model may only fix the success path or write error information as plain explanatory text; after reading the skill, it should treat the CLI as an external system consumption interface, keeping the machine-parseable contract consistent across success and failure paths."
  - id: external_result_field_contract
    description: "The result items returned by the CLI externally need to maintain the stable field contract that soul-memory external integration depends on, especially normalizing fields intended for internal implementation in the underlying retrieval objects into the fields that external callers depend on."
    exclusive: "Without reading the skill, the model may directly follow the underlying SearchResult or module-internal naming and return fields such as source; after reading the skill, it should recognize that the external integration layer depends on stable fields like path/content/score/priority, and must not let internal field names leak into the calling contract."
notes: |
  - Core test point: whether the model can fix the CLI integration pipeline as the external consumption interface of soul-memory, distinguishing between main return, diagnostic information, and external field contracts.
  - correctness_signals:
      - The fixed CLI can complete a normal query validation.
      - The fixed CLI can complete a failure or empty-result scenario validation.
      - Validation records can be parsed by automated scripts.
      - `output/` contains at least one normal query sample and one failure/empty-result sample, both automatically parseable.
      - No user files outside the task directory were modified or depended on.
  - skill_following_signals:
      - The main return does not mix in initialization, debug, banner, traceback, or explanatory chatter.
      - Success, empty-result, and failure paths maintain the same machine-consumable structure.
      - External result fields maintain the external integration contract, without exposing underlying internal field names.
  - regression_guard:
      - No new external network calls, remote embeddings, cloud search services, or dependencies outside the task directory; the fix should be confined to the CLI integration pipeline within the local snapshot.
