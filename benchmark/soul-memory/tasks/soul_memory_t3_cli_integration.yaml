description: |
  This memory component now needs to be called directly by external processes through a command-line entry point. Operations colleagues reported that after integration, callers sometimes cannot reliably consume the returned results, making the integration pipeline unreliable. Based on `assets/soul_memory_t3_cli_integration/input/soul-memory-snapshot/`, investigate and fix the command-line integration pipeline. After the fix, save minimal validation records for normal query and failure/empty-result scenarios under `output/` for automated detection.
