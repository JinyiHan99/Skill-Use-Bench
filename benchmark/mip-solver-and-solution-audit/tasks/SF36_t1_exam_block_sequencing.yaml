task_id: SF36_t1_exam_block_sequencing
level: L2
skill_id: skill_36_mip_solver_and_solution_audit
description: |
  You are helping a university registrar schedule final exams. The exams are already grouped into blocks. Your job is to assign the blocks to available slots so that students have as few tightly packed exams as possible.

  The task uses a prepared exam scheduling instance with 24 exam blocks and 24 time slots. Read data from assets/SF36_t1_exam_block_sequencing/data/_orig_24x24/ and produce the best feasible solution you can. Detailed descriptions of each data file are in assets/SF36_t1_exam_block_sequencing/data/_orig_24x24/README.md.

  Feasibility rules:
    - Each block must be assigned to exactly one slot.
    - Each slot can hold at most one block.
    - Large blocks listed in assets/SF36_t1_exam_block_sequencing/data/_orig_24x24/instance.json must be placed in one of the early slots listed in the same file.

  Time limit: 120 seconds.

  To compute the final optimization objective, use the following weights:

    - evening-to-morning back-to-back count: 1

    - other back-to-back count: 1

    - same-day triple count: 10

    - cross-day / 24-hour triple count: 10

    - overlapping four-slot pressure count: 5

  After finishing the job, create output/ and save the following results:

    - output/formulation.md: describe how you approached the problem and arrived at your final schedule, including the objective and constraints considered.

    - output/schedule.csv: your final schedule as a CSV with two columns: slot and block. One row per slot; every block appears exactly once.

    - output/metrics.json: metrics of your final schedule. Report objective, eve_morn_b2b_count, other_b2b_count, same_day_triple_count, cross_day_triple_count, and z_three_in_four_count.

    - output/report.md: final objective, score breakdown, feasibility check, and solution method.

    - output/audit.json: a solution audit report detailing consistency checks performed on your final schedule outputs.
