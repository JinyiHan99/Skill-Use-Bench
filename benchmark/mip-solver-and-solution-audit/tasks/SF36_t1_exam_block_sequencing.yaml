skill_constraints_tested:
- id: c2
  description: After writing the output files, they must be reloaded from disk and the pure evaluator rerun for roundtrip verification
  exclusive: When generating schedule/metrics/report only per the prompt, the model usually reports in-memory computed results and does not proactively re-parse the final submitted schedule.csv from disk as the single source of truth and recompute consistency.
- id: c3
  description: Build an independent pure-function evaluator (depends only on input + final output, not on solver variables), and cross-validate against the solver objective within 1e-6
  exclusive: Without auditing per this skill, the model may directly trust the solver objective or derive metrics from solver variables, rather than using an independent evaluation function that depends only on input data and the final schedule artifact for cross-validation.
- id: c4
  description: Before abandoning the exact MIP solver route, you must check whether PySCIPOpt is importable; if available, prefer it for modeling and solving, and record solver status/objective/bound/gap
  exclusive: Directly choosing the most familiar solver package, and if that package is unavailable, abandoning MIP and switching to pure heuristic, without additionally checking PySCIPOpt
