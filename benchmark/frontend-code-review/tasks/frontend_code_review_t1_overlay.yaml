skill_constraints_tested:
  - id: required_local_contracts_for_overlay_review
    description: The reviewer must inspect the local web contract and overlay/Dify UI primitive contracts before finalizing findings for code containing dialog or other floating UI.
    exclusive: Without the skill, a model is likely to review only the named component and miss the required repository-specific overlay and primitive contracts.
  - id: latest_web_interface_guidelines_for_ui_a11y
    description: UI, UX, and accessibility review must include the latest Web Interface Guidelines as a required baseline before final findings.
    exclusive: A generic frontend review usually relies on built-in accessibility knowledge and does not fetch the current external baseline.
  - id: overlay_contract_crosscheck_before_findings
    description: Before finalizing findings for dialog or floating UI, the reviewer must cross-check the component against the repo-local overlay and Dify UI primitive contracts, including web/AGENTS.md, web/docs/overlay.md, packages/dify-ui/README.md, and packages/dify-ui/AGENTS.md when relevant.
    exclusive: A generic frontend review may still produce actionable findings, but it will not reliably verify Dify-specific overlay primitive, portal, layering, and Dify UI contract expectations across the required local documents.
notes: |
  - Positive trigger: file-focused frontend review of a real Dify TSX component under web/.
  - Observable signals: reads component plus web/AGENTS.md, web/docs/overlay.md, Dify UI contracts, and performs a WebFetch of the Web Interface Guidelines URL before finalizing findings.
  - Scoring note: treat the observable signal as the fetch/read action itself, not strict agreement with any time-varying wording in the live external document.
  - Common failure: reviews only React logic, skips overlay contracts, skips Dify UI contracts, or reports speculative style preferences.
