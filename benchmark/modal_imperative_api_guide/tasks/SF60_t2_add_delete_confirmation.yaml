expected_trigger: true
skill_constraints_tested:
  - id: use_confirm_flow_for_destructive_action
    description: "A destructive one-step action should use the stack's dedicated imperative confirm flow, specifically `confirmModal` from `@lobehub/ui/base-ui`, while preserving async behavior on confirmation."
    exclusive: "Without the skill, a model may satisfy the behavior with `window.confirm`, a local-state declarative modal, or a custom confirmation built with `createModal`; the skill points to the dedicated base-ui `confirmModal` API for confirm flows."
  - id: deletion_deferred_to_confirm_callback
    description: "The delete button click should only open the imperative confirmation flow; `removeKnowledgeBase(id)` and `onDeleted?.()` must run only inside the positive confirm action callback."
    exclusive: "Without the skill, models may keep deletion in the button handler, add only a superficial prompt, or implement a generic stateful modal that does not follow the stack's imperative confirm convention."
notes: |
  - Positive case.
  - Correct behavior: clicking delete opens a confirmation prompt; only the positive confirmation awaits removeKnowledgeBase(id) and then calls onDeleted; canceling does not call either.
  - Skill evidence: output imports and calls `confirmModal` from `@lobehub/ui/base-ui`; the delete button's onClick only opens the confirmation flow; `removeKnowledgeBase(id)` appears only inside the confirm action callback.
  - Non-skill-but-task-correct examples: browser-native confirm, local-state declarative modal, or a custom confirmation built with createModal.
  - Common failures: immediate deletion, browser-native confirmation, declarative stateful modal, importing confirmModal from `@lobehub/ui`, using `createModal` for the confirmation, or losing the existing translation/button behavior.
