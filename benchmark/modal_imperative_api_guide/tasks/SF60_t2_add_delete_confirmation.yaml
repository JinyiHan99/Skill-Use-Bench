task_id: SF60_t2_add_delete_confirmation
level: L2
skill_id: skill_60_modal_imperative_api_guide
description: |
  The delete button on the knowledge-base detail page currently deletes immediately. Please change it so the user first sees a confirmation prompt and deletion runs only after confirmation; canceling should not delete. Preserve the existing button label and the post-delete callback behavior.

  The relevant input file is `assets/SF60_t2_add_delete_confirmation/input/src/features/LibraryModal/DeleteKnowledgeBase/index.tsx`. Keep it consistent with the existing interaction style of the current knowledge-base detail area.
  Place the modified file under `output/src/` at the corresponding path.
