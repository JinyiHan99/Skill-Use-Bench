      source: "Prepared from LobeChat knowledge-base modal conventions and component style, with API reference from https://github.com/lobehub/lobe-ui/blob/master/src/base-ui/Modal/index.md."
      real_state: "Delete action component in LobeChat style; it currently performs the async delete immediately from the button click."
      preparation: |
