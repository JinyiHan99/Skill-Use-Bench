skill_constraints_tested:
  - id: base_ui_host_required
    description: "When an imperative modal is opened through the newer modal stack, the matching global host from the same stack must be mounted once near the app root."
    exclusive: "Without the skill, a model may see an existing ModalHost in the provider tree and assume the modal host is already mounted, then debug the click handler, rewrite the entry as a declarative local-state modal, or replace the existing host. The skill-specific requirement is to recognize that the base-ui modal stack needs its own matching host while preserving the existing host."
  - id: preserve_imperative_entry
    description: "The existing feature entry should remain an imperative open function instead of being rewritten into local open-state rendering."
    exclusive: "Without the skill, some models may try to make the modal visible by introducing local React open state or an inline declarative dialog. The skill requires preserving the existing imperative createModal-based entry and fixing the matching host wiring instead."
notes: |
  - Positive case.
  - Correct behavior: add the missing matching host for the newer base-ui modal stack near the app root while preserving the existing legacy host.
  - Preserve the SkillStore imperative createModal-based entry; do not rewrite it into local React open state or an inline declarative dialog.
  - Preserve existing SkillStore content and title logic.
  - Common failures: replacing the existing legacy host instead of adding the base-ui host, importing only the already-present host, changing title/content behavior, or rewriting the feature into a declarative dialog.
