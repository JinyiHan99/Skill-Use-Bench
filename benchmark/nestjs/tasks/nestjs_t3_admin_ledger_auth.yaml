task_id: nestjs_t3_admin_ledger_auth
skill_id: nestjs
description: |
  This ledger demo service is about to be opened for an internal admin console trial. The admin console needs to access the ledger list with a logged-in session, and only the admin role can view the full transaction history. Please complete this access-control transformation within the existing project, while preserving the existing API documentation entry and module structure, and make the ledger endpoint's auth description consistent with the new login-state access method. The input project is at `./assets/nestjs_t3_admin_ledger_auth/input/ledger-service`.

