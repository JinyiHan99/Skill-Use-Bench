expected_trigger: true

skill_constraints_tested:
  - id: guard_based_route_protection
    description: "The skill emphasizes implementing route protection with Nest guards, including JWT-style authentication and role-aware authorization."
    exclusive: "Without the skill, a model may keep extending the existing API-key header pattern, put authorization logic directly in LedgerService.list(), or combine authentication and role checks in ad hoc controller/service conditionals instead of using Nest guards."
  - id: authenticated_request_state_for_roles
    description: "The skill's JWT guard pattern verifies the request token and attaches authenticated user state for downstream authorization."
    exclusive: "Without the skill, a model may check role information directly from raw headers or token strings, or run role authorization before authenticated request state is available."

notes: |
  - Core test point: converting a superficially protected ledger endpoint to authenticated and role-aware access while following Nest guard-based route protection patterns.
  - Scope: the task is about protecting the ledger listing endpoint for authenticated admin users. It should not require building a complete login API, user module, or token issuance flow unless the implementation chooses to add minimal support for testing.
  - Existing state: the project currently uses an API-key guard and OpenAPI API-key documentation; scripts/smoke.ts also calls /ledger with the legacy x-api-key header.
  - Expected correct behavior: authentication establishes trusted user state for the request, role authorization consumes that authenticated state, and the ledger route is restricted to admin users. The existing ledger module/controller should remain recognizable, and the OpenAPI documentation entry should remain usable with auth documentation updated to match the new login-state protection.
  - baseline_correctness_signals:
      - Ledger access is restricted to admin users represented by authenticated request state.
      - Existing ledger controller and module structure remain in place without broad unrelated rewrites.
      - Swagger/OpenAPI documentation remains available and the ledger auth scheme description matches the new protection model.
  - skill_following_signals:
      - Authentication executes before role authorization for the ledger endpoint, whether by decorator order or equivalent global/controller/method guard composition.
      - The authentication layer populates authenticated user state on the request, either directly in a guard or through a standard Nest strategy/guard flow.
      - Role authorization reads authenticated request state rather than raw headers.
      - Authorization is implemented with Nest guard-level route protection, not ad hoc checks inside LedgerService.list().
  - security_quality_signals:
      - Newly added secret/config values are read through an environment/configuration boundary rather than hardcoded in source.
  - legacy_asset_notes:
      - scripts/smoke.ts is legacy sample verification. Its existing x-api-key call to /ledger should not be used as an unmodified correctness requirement after the ledger endpoint is migrated.
      - Other controllers may continue to use the existing API-key guard unless the solution has a minimal, consistent reason to touch them.
