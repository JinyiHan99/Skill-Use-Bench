      source: "https://github.com/nest-native/drizzle/tree/main/sample/00-showcase"
      real_state: "A real full Nest-native Drizzle showcase application with accounts, projects, ledger, transfers, OpenAPI decorators, global validation, and an existing API-key style guard on all controllers including the ledger controller. The OpenAPI setup currently documents API-key authentication, and scripts/smoke.ts still calls /ledger with x-api-key: showcase-secret. It has no JWT-based request user attachment, no roles guard, no login/token issuance flow, and no existing @nestjs/jwt dependency."
