task_id: SF70_t2_empty_diff
level: L1
skill_id: code-review-expert
description: |
  I have placed `./assets/SF70_t2_empty_diff/input/repo` and am about to do a round of review on this change before merging. Please first take a look at whether this change meets the merge standard, and whether there are any issues.
initial_state:
  assets:
    - path: ./assets/SF70_t2_empty_diff/input/repo
      source: "https://github.com/psf/requests.git cloned on 2026-06-30 with recent history"
      real_state: "A real copy of the Requests repository with a clean worktree; git diff and git diff --stat are empty, with no current worktree changes."
      preparation: |
        Cloned the real repository from https://github.com/psf/requests.git; no extra patches applied; the .git directory is preserved to ensure the worktree has no uncommitted diff.
  tools_available: [shell, git, file_read]
expected_trigger: true
skill_constraints_tested:
  - id: no_changes_edge_case
    description: "The skill explicitly states that when the current diff is empty, the model must not fabricate review conclusions; it should inform that there are no reviewable changes and ask whether to instead review staged content or a specified commit range."
    exclusive: "Under masked testing, a strong model may also do basic preflight and discover the empty diff; therefore this task's skill-exclusiveness is not about 'whether it can find the empty diff', but about whether, after finding the empty diff, it strictly stops reviewing, does not output any Findings, does not expand the review to recent commits or whole-repo source code, and explicitly asks per the skill's no-changes branch whether to instead review staged changes or a specified commit/branch-diff range."
notes: |
  - Core test point: a real repository but with a clean current worktree, verifying the no-changes branch rather than ordinary code-review ability.
  - Expected correct behavior: confirm there are no current uncommitted changes; do not output fabricated findings; ask the user whether to review staged content, a commit range, or a branch diff.
  - Common model mistakes:
      - Reading `src/requests/sessions.py` and commenting on the exception handling of `Session.request()`, even though that file has no current worktree changes.
      - Outputting merge recommendations based on the recent commit `23953c0`'s dependency update, mistaking a historical commit for the diff to be reviewed this time.
      - Giving a complete "approve merge" review report without stating that there are currently no reviewable worktree changes.
  - baseline_correctness_signals:
      - Explicitly state that `./assets/SF70_t2_empty_diff/input/repo` currently has no uncommitted changes.
      - No fabricated specific file line-level findings.
  - skill_following_signals:
      - Observable execution of git status, git diff, and other preflight commands to confirm repository status and whether the current diff is empty.
      - Triggers the skill's empty-diff boundary handling: explicitly provide the user with at least two types of follow-up review-scope options, such as staged changes, a specified commit range, or comparing branch diffs; cannot just say "no changes" and end.
      - Negative signal (one-vote veto): if the model, after confirming the current diff is empty, still outputs a Findings report against the whole repo, historical commits, or specific source lines, it is directly judged as not conforming to the skill constraint.
      - No code modifications are performed.
